<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>સુરત પુસ્તક સેન્ટર - 40% ડિસ્કાઉન્ટ</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #333; }
    .header { text-align: center; padding: 20px 0; }
    .header h1 { font-size: 1.4rem; color: #8B4513; margin: 0 0 8px 0; }
    .header .contact { font-size: 1rem; color: #E85D04; font-weight: bold; }
    .header .note { font-size: 0.9rem; color: #666; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card .price { position: absolute; bottom: 8px; right: 8px; background: rgba(232,93,4,0.9); color: #fff; padding: 4px 8px; border-radius: 8px; font-weight: bold; font-size: 12px; }
    .card .wrap { position: relative; }
    .card .title { padding: 10px; font-size: 13px; font-weight: bold; min-height: 40px; }
    .placeholder { width: 100%; height: 160px; background: linear-gradient(135deg,#e8d5c4,#d4b896); display: flex; align-items: center; justify-content: center; color: #8B4513; font-size: 12px; }
    a.wa { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #25D366; color: #fff; border-radius: 12px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 સુરત પુસ્તક સેન્ટર</h1>
    <p class="contact">40% ડિસ્કાઉન્ટ • 📞 98241 12625</p>
    <p class="note">પુસ્તકો રૂબરૂમાં મળશે. કુરિયર દ્વારા પણ મોકલાય. GPay થી ચુકવણી.</p>
  </div>
  <div id="grid" class="grid"></div>
  <div style="text-align:center; padding:24px;">
    <a href="https://wa.me/919824112625" class="wa">WhatsApp પર ઓર્ડર કરો</a>
  </div>
  <script>
    const base = window.location.href.replace(/\/[^/]*$/, '/');
    fetch(base + 'books_store.json').then(r=>r.json()).then(data=>{
      const g = document.getElementById('grid');
      const coversBase = base + 'book_covers/';
      (data.books||[]).forEach(b=>{
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = '<div class="wrap"><img src="' + coversBase + b.img + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="placeholder" style="display:none">📖</div><span class="price">₹' + b.price + '</span></div><div class="title">' + (b.name||'') + '</div>';
        g.appendChild(div);
      });
    }).catch(e=>document.getElementById('grid').innerHTML='<p>લોડ થતું નથી.</p>');
  </script>
</body>
</html>
