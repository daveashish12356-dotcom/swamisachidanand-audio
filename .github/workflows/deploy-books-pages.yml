# Deploy full public/ folder (audio_list, thumbnails, suvichar, etc.) plus books
# Repo Settings > Pages > Source: "Deploy from a branch" > Branch: gh-pages > / (root)
name: Deploy public data to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy public data (audio list, books, thumbnails, suvichar) to _site
        run: |
          mkdir -p _site
          # Full public folder under /public so existing app URLs keep working
          cp -r public _site/public

          # Convenience copies at root (as before) for books/thumbnails
          cp -r public/books _site/ 2>/dev/null || true
          cp -r public/thumbnails _site/ 2>/dev/null || true

          # Ensure suvichar files exist in both places
          cp public/suvichar_config.json _site/public/ 2>/dev/null || true
          cp public/suvichar_control.html _site/public/ 2>/dev/null || true

          # Simple index so site root opens
          cp public/index.html _site/index.html 2>/dev/null || echo "Swami Sachchidanand audio server" > _site/index.html
          ls -la _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
